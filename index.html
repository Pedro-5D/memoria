<style>
:root{color-scheme:dark;--bg:#0f0b1e;--panel:#1b1535;--fg:#ece7ff;--muted:#a79fcf;--line:#3a2f6b;--accent:#f0c24b;--err:#ff5c80;--c-bg:#fff;--c-given:#e8e4f4;--c-peer:#f0edfa;--c-sel:#cfc3ff;--c-line:#cdc6e2;--c-strong:#2b2150}
*{box-sizing:border-box}
html{background:#0f0b1e}
body{margin:0;background:radial-gradient(ellipse at top,#241a4d,#0f0b1e 60%) fixed;color:var(--fg);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding:14px max(16px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
h1{font-size:1.5rem;margin:0;letter-spacing:.04em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.9rem}
.nav{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:.85rem;margin-bottom:4px}
.nav a{color:var(--muted);text-decoration:none;padding:2px 2px;border-bottom:1px solid transparent}
.nav a:hover{color:var(--fg)}.nav a[aria-current]{color:var(--accent);border-bottom-color:var(--accent)}
.stats{display:flex;gap:16px;justify-content:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:4px;min-height:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,select:focus-visible,.cell:focus-visible,.tok:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"],button.pri{background:var(--accent);color:#241a00;border-color:var(--accent);font-weight:600}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.5;cursor:default}
.sym{filter:drop-shadow(0 1px 2px #0009);aspect-ratio:1;background-size:contain;background-repeat:no-repeat;background-position:center;position:relative;display:block}
.tok{box-shadow:0 2px 8px #0006;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.tok .sym{width:100%}
.tok small{font:700 12px/1 system-ui,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums}
.tok.done{opacity:.3}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.estado{color:var(--accent);font-size:13px;font-weight:600}
.win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,24,.62);padding:20px;z-index:20}
.win div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.win h2{margin:0;font-size:24px;color:var(--accent)}.win p{margin:0;color:var(--muted)}
body.embed h1,body.embed .hint,body.embed .nav{display:none}
@media (prefers-reduced-motion:no-preference){.cell,.slot{transition:background .12s}}

.tablero{display:grid;grid-template-columns:repeat(4,var(--cs));gap:var(--g);justify-content:center;--cs:min(19.5vw,100px);--g:8px;padding:var(--g);background:#2b2150;border-radius:12px;width:max-content;margin:0 auto;box-shadow:0 10px 30px #0008;user-select:none}
.carta{width:var(--cs);height:var(--cs);padding:0;border:0;background:none;border-radius:10px;perspective:600px;cursor:pointer}
.carta:disabled{opacity:1;cursor:default}
.int{position:relative;display:block;width:100%;height:100%;transition:transform .3s;transform-style:preserve-3d}
.carta.vol .int{transform:rotateY(180deg)}
.dorso,.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center}
.dorso{background:radial-gradient(circle at 50% 50%,#f0c24b 0 6%,transparent 7% 20%,#f0c24b44 21% 23%,transparent 24%),linear-gradient(135deg,#4a3d99,#1d1640);border:1px solid #5b4fb0}
.cara{background:#fff;transform:rotateY(180deg);border:1px solid #cdc6e2}
.cara .sym{width:88%}
.carta.hecha .cara{background:#e3def2;box-shadow:inset 0 0 0 3px #f0c24b}
.carta.hecha .sym{opacity:.8}
.carta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.int{transition:none}}
.marcador{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.marcador div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;min-width:72px}
.marcador small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.marcador b{font-size:17px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Memoria planetaria</h1>
    <p id="sub">Encuentra las parejas de discos</p>
    <div class="stats"><span id="estado" class="estado"></span></div>
  </header>
  <div class="marcador"><div><small>Parejas</small><b id="pares">0/8</b></div><div><small>Intentos</small><b id="mov">0</b></div><div><small>Tiempo</small><b id="tiempo">0:00</b></div><div><small id="lmejor">Mejor</small><b id="mejor">–</b></div></div>
  <div class="bar">
    <select id="modo" aria-label="Modo">
      <option value="facil">Fácil · 4×3 · 6 parejas</option>
      <option value="medio" selected>Medio · 4×4 · 8 parejas</option>
      <option value="dificil">Difícil · 4×6 · 12 parejas</option>
      <option value="planeta">Por planeta · 4×3 · 6 parejas</option>
    </select>
    <button id="nuevo" class="pri">Nueva partida</button>
    <button id="dia" title="Las mismas cartas, en el mismo sitio, para todo el mundo, cada día">Del día</button>
  </div>
  <div class="tablero" id="tablero" role="grid" aria-label="Cartas"></div>
  <p class="hint" id="ayuda"></p>
  <div class="win" id="win" hidden><div><h2>¡Completado!</h2><p id="wintxt"></p><button id="otra" class="pri">Otra partida</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const NOM=['Júpiter azul','Marte rosa','Venus verde','Mercurio amarillo','Luna azul','Sol rosa','Mercurio verde','Venus amarillo','Marte azul','Júpiter rosa','Sol verde','Luna amarilla'];
const PLA=[0,1,2,3,4,5,3,2,1,0,5,4],COL=[0,1,3,2,0,1,3,2,0,1,3,2]; // planeta (Júpiter, Marte, Venus, Mercurio, Luna, Sol) y color (azul, rosa, amarillo, verde)
const PO=NOM.map((n,i)=>({c:'m'+(i+1),n,pl:PLA[i],co:COL[i]}));
const MODOS={facil:{pares:6,tipo:'igual',t:'Fácil'},medio:{pares:8,tipo:'igual',t:'Medio'},dificil:{pares:12,tipo:'igual',t:'Difícil'},planeta:{pares:6,tipo:'planeta',t:'Por planeta'}};
const AYUDA={igual:'Toca dos cartas para darles la vuelta: si son el mismo disco, se quedan; si no, se vuelven a tapar. Gana quien encuentra todas las parejas con menos intentos. El tiempo empieza al dar la vuelta a la primera carta.',
  planeta:'Hay que emparejar cada planeta con su otro color: Júpiter azul con Júpiter rosa, la Luna azul con la Luna amarilla, y así con los seis planetas. Las parejas no son discos iguales.'};
let rng=Math.random;
function semilla(txt){let h=1779033703^txt.length;for(let i=0;i<txt.length;i++){h=Math.imul(h^txt.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  let a=(Math.imul(h^h>>>16,2246822507)^Math.imul(h^h>>>13,3266489909))>>>0;
  return ()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(new Date());
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function repartir(modo){const m=MODOS[modo];let ids;
  if(modo==='facil'){ids=[];for(let p=0;p<6;p++){const d=PO.map((x,i)=>i).filter(i=>PO[i].pl===p);ids.push(d[Math.floor(rng()*d.length)]);}ids=ids.concat(ids);} // un disco por planeta: ninguna pareja se confunde
  else if(modo==='medio'){ids=shuffle([...PO.keys()]).slice(0,m.pares);ids=ids.concat(ids);}
  else if(modo==='dificil'){ids=[...PO.keys()];ids=ids.concat(ids);}
  else ids=[...PO.keys()];
  return shuffle(ids);}
const clave=(c,m)=>m.tipo==='igual'?c.c:'p'+c.pl;
let S=null,abiertas=[],bloq=false,tm=null;
function t(){return S.tAcum+(tm?Date.now()-tm:0);}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
const kS=x=>x.dia?'mem-dia-'+x.modo+'-'+x.dia:'mem-v1-'+x.modo;
function nueva(dia){
  if(typeof dia!=='string')dia=null;const modo=$('modo').value;
  rng=dia?semilla('mem|'+dia+'|'+modo):Math.random;let deck;try{deck=repartir(modo);}finally{rng=Math.random;}
  S={modo,dia,deck,hecha:deck.map(()=>false),mov:0,tAcum:0,fin:false};tm=null;abiertas=[];bloq=false;
  $('win').hidden=true;construir();guardar();
}
function guardar(){if(!S)return;try{localStorage.setItem(kS(S),JSON.stringify({...S,tAcum:t()}));if(!S.dia)localStorage.setItem('mem-ultimo',S.modo);}catch(e){}}
function cargar(modo,dia){
  try{const x=JSON.parse(localStorage.getItem(dia?'mem-dia-'+modo+'-'+dia:'mem-v1-'+modo));
    const n=MODOS[modo]?MODOS[modo].pares*2:0;
    if(x&&!x.fin&&x.modo===modo&&Array.isArray(x.deck)&&x.deck.length===n&&(x.dia||null)===(dia||null)&&x.deck.every(i=>PO[i])){S=x;tm=null;abiertas=[];bloq=false;$('modo').value=modo;$('win').hidden=true;construir();return true;}}catch(e){}
  return false;
}
function construir(){
  const m=MODOS[S.modo],tb=$('tablero');tb.innerHTML='';
  S.deck.forEach((id,i)=>{const b=document.createElement('button');b.type='button';b.className='carta'+(S.hecha[i]?' vol hecha':'');b.dataset.i=i;
    b.innerHTML='<span class="int"><span class="dorso"></span><span class="cara"><span class="sym '+PO[id].c+'"></span></span></span>';
    b.setAttribute('aria-label',S.hecha[i]?PO[id].n:'Carta '+(i+1));b.disabled=!!S.hecha[i];tb.appendChild(b);});
  $('sub').textContent=S.dia?'Reto del día · '+S.dia.split('-').reverse().join('/')+' · '+m.t:'Encuentra las parejas de discos';
  $('ayuda').textContent=AYUDA[m.tipo];$('lmejor').textContent=S.dia?'Mejor hoy':'Mejor';
  refrescar();
}
function refrescar(){
  const p=S.hecha.filter(Boolean).length/2;$('pares').textContent=p+'/'+S.deck.length/2;$('mov').textContent=S.mov;
  let b=null;try{b=JSON.parse(localStorage.getItem(S.dia?'mem-best-dia-'+S.dia+'-'+S.modo:'mem-best-'+S.modo));}catch(e){}
  $('mejor').textContent=b?b.mov+' · '+fmt(b.t):'–';
}
function voltear(i,s){const e=$('tablero').children[i];e.classList.toggle('vol',s);e.setAttribute('aria-label',s?PO[S.deck[i]].n:'Carta '+(i+1));}
$('tablero').addEventListener('click',e=>{
  const c=e.target.closest('.carta');if(!c||!S||bloq||S.fin)return;const i=+c.dataset.i;
  if(S.hecha[i]||abiertas.includes(i))return;
  if(!tm&&!S.mov&&!abiertas.length&&S.tAcum===0)tm=Date.now();else if(!tm)tm=Date.now();
  voltear(i,true);abiertas.push(i);
  if(abiertas.length<2)return;
  S.mov++;const [a,b]=abiertas,m=MODOS[S.modo];bloq=true;
  if(clave(PO[S.deck[a]],m)===clave(PO[S.deck[b]],m)){
    setTimeout(()=>{S.hecha[a]=S.hecha[b]=true;for(const k of [a,b]){const el=$('tablero').children[k];el.classList.add('hecha');el.disabled=true;}
      abiertas=[];bloq=false;refrescar();guardar();comprobar();},380);
  }else{
    setTimeout(()=>{voltear(a,false);voltear(b,false);abiertas=[];bloq=false;refrescar();guardar();},800);
  }
});
function comprobar(){
  if(!S.hecha.every(Boolean))return;S.fin=true;const tt=t();tm=null;S.tAcum=tt;
  const k=S.dia?'mem-best-dia-'+S.dia+'-'+S.modo:'mem-best-'+S.modo;let b=null;try{b=JSON.parse(localStorage.getItem(k));}catch(e){}
  let rec='';if(!b||S.mov<b.mov||(S.mov===b.mov&&tt<b.t)){try{localStorage.setItem(k,JSON.stringify({mov:S.mov,t:tt}));}catch(e){}rec=' ¡Nuevo mejor resultado!';}
  $('wintxt').textContent=MODOS[S.modo].t+' · '+S.mov+' intentos · '+fmt(tt)+'.'+rec;$('win').hidden=false;
  try{localStorage.removeItem(kS(S));}catch(e){}refrescar();
}
function diaria(){const d=hoy(),modo=$('modo').value;guardar();if(!cargar(modo,d))nueva(d);}
$('nuevo').onclick=()=>nueva();$('otra').onclick=()=>nueva();$('dia').onclick=diaria;
$('modo').onchange=()=>{guardar();if(!cargar($('modo').value))nueva();};
setInterval(()=>{if(S&&!S.fin&&tm)$('tiempo').textContent=fmt(t());else if(S&&!tm)$('tiempo').textContent=fmt(S.tAcum);},400);
document.addEventListener('visibilitychange',()=>{if(!S||S.fin)return;if(document.hidden&&tm){S.tAcum=t();tm=null;guardar();}});
window.addEventListener('pagehide',guardar);
(function inicio(){
  const q=new URLSearchParams(location.search);if(q.has('embed'))document.body.classList.add('embed');
  let m='medio';try{m=localStorage.getItem('mem-ultimo')||m;}catch(e){}
  if(MODOS[q.get('modo')])m=q.get('modo');if(!MODOS[m])m='medio';$('modo').value=m;
  if(q.has('dia')){diaria();return;}
  if(!cargar(m))nueva();
})();
</script>
</body>
</html>
